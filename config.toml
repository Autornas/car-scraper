# Project settings. Every script reads its defaults from here; a command-line
# flag still overrides a value for that one run. Paths are relative to the
# project folder. Delete a line to fall back to the built-in default.

[paths]
data_dir = "data"
reports_dir = "reports"
database = "data/autoplius.db"

[autoplius]
enabled = true
delay = 2.0              # seconds between requests (faster got HTTP 429 + a CAPTCHA)
concurrency = 1          # pages fetched in parallel per batch
max_age_days = 7         # re-scrape a model once it is older than this
empty_max_age_days = 30  # re-check models that had no listings this often
nightly_limit = 500      # models per nightly run, oldest first (~a full pass a week)
description_delay = 2.0  # seconds between ad-page requests
block_threshold = 8      # consecutive refusals before a run stops

[autogidas]
enabled = true           # scrape and watch autogidas.lt too
delay = 2.0
concurrency = 1
max_age_days = 7         # searched per make (~90 makes), so a full pass is ~1,400 pages
empty_max_age_days = 30
nightly_limit = 100      # makes per nightly run
description_delay = 2.0
block_threshold = 8

[watcher]
interval_minutes = 3     # time between scan starts
margin_pages = 1         # extra pages read after the first all-known page
max_pages = 50           # safety cap per scan (~1,000 ads, roughly a day)
delay = 1.0              # seconds between page requests
read_cheap_ads = true    # open the ad of every new car under its p10 to check for defects
min_similar = 5          # similar cars (same model, year +-1, mileage +-30%) needed to confirm a deal; fewer = "maybe"
min_discount = 0.10      # a deal is in the cheapest quarter of similar cars AND this far under their median

[report]
bucket = 3               # year-band width inside a generation
min_n = 5                # smallest group shown
candidates = 300         # unread candidates listed for description checks
nightly_reads = 150      # unchecked ads the nightly job reads per site (0 = none)
stale_days = 10          # not seen for longer = may be sold: hidden from deals, not read
pooled = true            # LightGBM price model (false = per-group baselines)

[dashboard]
start_watcher = true     # start the watcher when the dashboard starts

[backup]
# Copies of the database on another drive (scripts/backup.py). The dashboard
# makes one whenever the newest is older than every_days. Set the folder in
# config.local.toml, since it belongs to one PC:  dir = "D:/car-scraper-backups"
dir = ""                 # empty = no backups
every_days = 3
keep = 5                 # newest copies kept; older ones are deleted

[alerts]
# Telegram messages; off until a bot token is set in data/secrets.toml
# (see scripts/collectors/alerts.py). Never put the token in this file.
deals = true             # new cars the watcher rates "deal" (only those on your watchlist, once you set one)
watcher_failures = true  # a site's watcher failing 3 scans in a row

[web]
# This PC's own values (auth, admins, ...) live in config.local.toml, which git ignores.
host = "127.0.0.1"       # only this PC; others reach it through Cloudflare Tunnel
port = 8765
auth = "local"           # "local": only you on this PC; "tailscale": your tailnet (admins below); "cloudflare": signed-in users
team_domain = ""         # cloudflare: e.g. "yourteam.cloudflareaccess.com"
audience = ""            # cloudflare: the Access application's AUD tag
admins = []              # cloudflare: e.g. ["you@gmail.com"]
viewers = []             # cloudflare: e.g. ["friend@gmail.com"]
viewer_descriptions = true   # viewers see sellers' descriptions

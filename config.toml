# Project settings. Every script reads its defaults from here; a command-line
# flag still overrides a value for that one run. Paths are relative to the
# project folder. Delete a line to fall back to the built-in default.

[paths]
data_dir = "data"
reports_dir = "reports"
database = "data/autoplius.db"

[autoplius]
enabled = true
delay = 2.0              # seconds between requests (faster got HTTP 429 + a CAPTCHA)
concurrency = 1          # pages fetched in parallel per batch
max_age_days = 7         # re-scrape a model once it is older than this
empty_max_age_days = 30  # re-check models that had no listings this often
nightly_limit = 500      # models per nightly run, oldest first (~a full pass a week)
description_delay = 2.0  # seconds between ad-page requests
block_threshold = 8      # consecutive refusals before a run stops

[autogidas]
enabled = true           # scrape and watch autogidas.lt too
delay = 2.0
concurrency = 1
max_age_days = 7         # searched per make (~90 makes), so a full pass is ~1,400 pages
empty_max_age_days = 30
nightly_limit = 100      # makes per nightly run
description_delay = 2.0
block_threshold = 8

[watcher]
interval_minutes = 5     # time between scan starts
margin_pages = 1         # extra pages read after the first all-known page
max_pages = 50           # safety cap per scan (~1,000 ads, roughly a day)
delay = 1.0              # seconds between page requests
read_cheap_ads = true    # open the ad of every new car under its p10 to check for defects

[report]
bucket = 3               # year-band width inside a generation
min_n = 5                # smallest group shown
candidates = 300         # unread candidates listed for description checks
pooled = true            # LightGBM price model (false = per-group baselines)

[dashboard]
port = 8765
start_watcher = true     # start the watcher when the dashboard starts

                    <script type="text/javascript">
            //<![CDATA[
            function FinnCart (list_name, list_data)
            {

                this.list_item_id = null;
                this.hidden = {};
                this.sublist_item_counter = 0;
                this.list_name = list_name;
                this.list_data = list_data;
                this.max_items = 30;

                this.change_list = function ()
                {
                    var sublist_portal = $('#'+this.list_name+'_sublist_portal');
                    this.list_item_id = $('#'+this.list_name+'_list').children('option:selected').val();

                    sublist_portal.html('');
                    $('#addbtn_'+list_name).removeClass('add-btn');

                    if (this.list_item_id != 0 && this.list_data[this.list_item_id])
                    {
                        var finnCart = this;
                        var sublist_portal_item;

                        var value = this.list_name+'-'+this.list_item_id+'-0';
                        if ($('#'+this.list_name+'_sublist optgroup').children('option[value="subl_'+value+'"]').length == 0)
                        {
                            sublist_portal_item = $(document.createElement('option'));
                            sublist_portal_item.attr ('value', value);
                            sublist_portal_item.text ($('#'+this.list_name+'_list').children('option:selected').text() + ' (visi)');
                            sublist_portal.append (sublist_portal_item);
                        }

                        for(i in this.list_data[this.list_item_id])
                        {
                            value = this.list_name+'-'+this.list_item_id+'-'+i.replace("__", "").replace("_", "");
                            if ($('#'+this.list_name+'_sublist optgroup').children('option[value="subl_'+value+'"]').length > 0)
                                continue;
                            sublist_portal_item = $(document.createElement('option'));
                            sublist_portal_item.attr ('value', value);
                            sublist_portal_item.text (this.list_data[this.list_item_id][i]);
                            sublist_portal.append (sublist_portal_item);
                        }
                    }
                }

                this.remove_selected = function ()
                {
                    var finnCart = this;
                    var need_change_list = false;
                    var sublist_items = $('#'+finnCart.list_name+'_sublist optgroup').children('option:selected');
                    $('#'+finnCart.list_name+'_messages').html('');
                    sublist_items.each( function(i)
                    {
                        var sublist_item_val = $(this).val().split('-');
                        delete finnCart.hidden[sublist_item_val[1]][sublist_item_val[2]];
                        if (isEmpty(finnCart.hidden[sublist_item_val[1]]))
                            delete finnCart.hidden[sublist_item_val[1]];
                        finnCart.sublist_item_counter--;

                        //if current list item is removed, we need to rearrange that list
                        need_change_list = (need_change_list || sublist_item_val[1] == finnCart.list_item_id);
                    });

                    if (sublist_items.length > 0)
                    {
                        $('#'+finnCart.list_name+'_sublist optgroup').children('option:selected').remove();

                        $('#'+finnCart.list_name+'_sublist optgroup:empty').remove();
                        if (need_change_list)
                            finnCart.change_list();
                    }
                    $('#delbtn_'+list_name).removeClass('remove-btn');
                }

                this.add_selected = function ()
                {
                    var finnCart = this;
                    var portal_items = $('#'+finnCart.list_name+'_sublist_portal').children('option:selected');

                    if (this.hidden[this.list_item_id] == undefined)
                        this.hidden[this.list_item_id] = {};

                    if (finnCart.sublist_item_counter + portal_items.length < finnCart.max_items)
                    {
                        portal_items.each( function(i)
                        {
                            finnCart.sublist_item_counter++;

                            var sublist_item_val = $(this).val().split('-')[2];
                            finnCart.hidden[finnCart.list_item_id][sublist_item_val] = sublist_item_val;
                            var sublist_item = $(document.createElement('option'));
                            sublist_item.attr ('value', 'subl_'+$(this).val());
                            sublist_item.text ($(this).text());

                            var label = $('#'+finnCart.list_name+'_list').children('option:selected').text();
                            var optgroup = $('#'+finnCart.list_name+'_sublist optgroup[label="'+label+'"]');
                            if (optgroup.length > 0)
                                optgroup.append(sublist_item);
                            else
                            {
                                optgroup = $(document.createElement('optgroup'));
                                optgroup.attr ('label', label);
                                $('#'+finnCart.list_name+'_sublist').append(optgroup);
                                optgroup.append(sublist_item);
                            }
                        });

                        portal_items.remove();
                        $('#'+finnCart.list_name+'_messages').html('');
                        $('#addbtn_'+list_name).removeClass('add-btn');
                    }
                    else
                    {
                        apMessageBox(finnCart.list_name+'_messages', '_max_item_select_search', 'warning');
                    }
                }

                this.fill_sublist = function (selected_data)
                {
                    var finnCart = this;
                    $('#'+finnCart.list_name+'_sublist').children('option').remove();
                    for (items_id in selected_data)
                    {
                        if (finnCart.list_data[items_id] == null)
                            continue;

                        if (String(selected_data[items_id]).indexOf('_') > -1)
                            var selected_items = selected_data[items_id].split('_');
                        else
                            var selected_items = [selected_data[items_id]];

                        for (item_id in selected_items)
                        {
                            if (selected_items[item_id]!=0 && finnCart.list_data[items_id]['_'+selected_items[item_id]] == null)
                                continue;
                            finnCart.sublist_item_counter++;

                            if (finnCart.hidden[items_id] == undefined)
                                finnCart.hidden[items_id] = {};
                            finnCart.hidden[items_id][selected_items[item_id]] = selected_items[item_id];

                            var sublist_item = $(document.createElement('option'));
                            sublist_item.attr ('value', 'subl_'+finnCart.list_name+'-'+items_id+'-'+selected_items[item_id]);

                            var sublist_item_text;
                            if (selected_items[item_id] > 0)
                                sublist_item_text = finnCart.list_data[items_id]['_'+selected_items[item_id]];
                            else
                                sublist_item_text = $('#'+finnCart.list_name+'_list').children('option[value="'+items_id+'"]').text() + ' (visi)';
                            sublist_item.text (sublist_item_text);

                            var label = $('#'+finnCart.list_name+'_list').children('option[value="'+items_id+'"]').text();
                            var optgroup = $('#'+finnCart.list_name+'_sublist optgroup[label="'+label+'"]');
                            if (optgroup.length > 0)
                                optgroup.append(sublist_item);
                            else
                            {
                                optgroup = $(document.createElement('optgroup'));
                                optgroup.attr ('label', label);
                                $('#'+finnCart.list_name+'_sublist').append(optgroup);
                                optgroup.append(sublist_item);
                            }

                            $('#'+finnCart.list_name+'_sublist_portal').children('option[value="'+finnCart.list_name+'-'+items_id+'-'+selected_items[item_id]+'"]').remove();
                        }
                    }
                }

                this.make_hidden = function ()
                {
                    var portal_items = $('#'+this.list_name+'_sublist_portal').children('option:selected');
                    if (this.list_item_id > 0 && !isEmpty(this.hidden))
                    {
                        for (this.list_item_id in this.hidden)
                        {
                            var inp = document.createElement('input');
                            inp.type = 'hidden';
                            inp.name = this.list_name+'['+this.list_item_id+']';
                            var sublist_item;
                            for (sublist_item in this.hidden[this.list_item_id])
                                inp.value += sublist_item+'_';
                            inp.value = inp.value.substr(0, inp.value.length-1);
                            $('#search_form').append(inp);
                        }
                    }
                    else if (this.list_item_id > 0 && portal_items.length > 0)
                    {
                        var inp = document.createElement('input');
                        inp.type = 'hidden';
                        inp.name = this.list_name+'['+this.list_item_id+']';
                        portal_items.each ( function (i)
                        {
                            var model_id = $(this).val().split('-');
                            model_id = model_id[model_id.length-1];
                            inp.value += model_id+'_';
                        });
                        inp.value = inp.value.substr(0, inp.value.length-1);
                        $('#search_form').append(inp);

                        return false;
                    }
                    else if (this.list_item_id > 0)
                    {
                        var inp = document.createElement('input');
                        inp.type = 'hidden';
                        inp.name = this.list_name+'['+this.list_item_id+']';
                        inp.value = 0;
                        $('#search_form').append(inp);
                    }
                }

                var finnCart = this;
                $('#'+finnCart.list_name+'_sublist_portal').dblclick(function()
                {
                    finnCart.add_selected();
                    $('#addbtn_'+list_name).removeClass('add-btn');
                });

                $('#'+finnCart.list_name+'_sublist').dblclick(function()
                {
                    finnCart.remove_selected();
                    $('#delbtn_'+list_name).removeClass('remove-btn');
                });

                $('#'+finnCart.list_name+'_sublist_portal').change(function()
                {
                    $('#addbtn_'+list_name).addClass('add-btn');
                });

                $('#'+finnCart.list_name+'_sublist').change(function()
                {
                    $('#delbtn_'+list_name).addClass('remove-btn');
                });
            }
            //]]>
        </script>
